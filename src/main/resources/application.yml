server:
  port: 19051

spring:
  config:
    import: optional:file:book-service/.env[.properties]

  application:
    name: bookservice

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${BOOK_DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    org.flywaydb: info
    com.pagely.bookservice: debug

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

api:
  aladin:
    ttbkey: ${TTBKEY}
